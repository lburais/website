        body {
            background-color: #eef2f5;
            margin: 0;

        }
        /* Topbar typique style FindPenguins */
        .travel-header {
            background-color: #1a73e8; /* Bleu FindPenguins */
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .timeline-container {
            max-width: 650px;
            margin: 30px auto;
            padding: 10px;
        }
        /* Transformation de la liste Markdown en étapes de voyage chronologiques */
        .timeline-container ul {
            padding: 0;
            list-style: none;
            border-left: 3px solid #1a73e8;
            margin-left: 20px;
        }
        .timeline-container li {
            position: relative;
            padding-left: 30px;
            margin-bottom: 30px;
        }
        /* Bulle d'étape sur la ligne */
        .timeline-container li::before {
            content: '';
            position: absolute;
            left: -11px;
            top: 4px;
            background: #1a73e8;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid #eef2f5;
        }
        .back-home { display: block; text-align: center; margin-bottom: 40px; color: #1a73e8; text-decoration: none; }
    </style>
</head>
