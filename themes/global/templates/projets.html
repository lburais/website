<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/main.css" type="text/css" />
</head>
<body class="projets">
    <div class="page-container">
        <header class="banner" style="background: #a0169e">
            <h1>{{ page.title }}</h1>
            <a class="home-button" href="{{ SITEURL }}/" aria-label="Accueil" title="Famille Burais">
                <span aria-hidden="true">⌂&#xFE0E;</span>
            </a>
        </header>

        <!-- Injection automatique de la liste des projets -->
        <ul class="items">
        {% for p in pages if p.relative_source_path.startswith('pages/projets/') and p.relative_source_path.count('/') == 2 %}
            {% set link = p.url if p.url is defined and p.url else SITEURL ~ '/' ~ p.slug ~ '.html' %}
            <li class="item">
                <a class="bubble" href="{{ link }}"{% if p.image %} style="background-image:url('{{ SITEURL }}/projets/{{ p.image }}')"{% endif %}><span>{{ p.title }}</span></a>
                <p>{{ p.description }}</p>
            </li>
        {% endfor %}
        </ul>
    </div>
</body>
</html>
