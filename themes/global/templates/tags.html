{% extends "base.html" %}

{% block title %}{{ SITENAME }} - Tags{% endblock %}
{% set banner_title = "Tags" %}

{% block content %}

    <article class="pure-g">
    {%- for tag, articles in tags | sort %}
        <div class="pure-u-1-2 pure-u-md-1-5">
            <a href="{{ SITEURL }}/{{ tag.url }}">
            <div class="tag-cat-button">
                <div>{{ tag }}</div>
                <div class="article-count">({{ articles | count }})</div>
            </div>
            </a>
        </div>
    {% endfor %}
    </article>

{% endblock %}
