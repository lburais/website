{% extends "base.html" %}

{% block title %}{{ SITENAME }} - Tags{% endblock %}
{% set banner_title = "Tags" %}

{% block content %}

    <div class="tag-cloud">
    {%- for tag, articles in tags|sort %}
        <a href="{{ SITEURL }}/{{ tag.url }}" class="tag-btn" style="font-size: {{ articles|count|count_to_font_size }};">
        <span class="tag-name">{{ tag }}</span>
        <span class="tag-count">{{ articles|count }}</span>
        </a>
    {%- endfor %}
    </div>

{% endblock %}
