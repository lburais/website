<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Figeac</title>
    <link rel="stylesheet" href="https://lburais.github.io/website/theme/findpenguins/css/footprint.css" type="text/css" />

<body>

    <article class="footprint">

        <header class="fp-header">
            <div class="fp-hero fp-hero-map">
                <div class="fp-nav">
<a class="fp-arrow" href="https://lburais.github.io/website/findpenguins/51xfd5fd05zj2/occitanie-2026/footprint_4/footprint.html" title="Felzins">&#9664;</a>                    <div class="fp-progress" aria-label="Jour 5">

                    </div>
<a class="fp-arrow" href="https://lburais.github.io/website/findpenguins/51xfd5fd05zj2/occitanie-2026/footprint_6/footprint.html" title="Ispagnac">&#9654;</a>                </div>

                    <div class="fp-map">
                        <div class="fp-map-frame" id="fp-country-map"

                            <img src="https://lburais.github.io/website/findpenguins/51xfd5fd05zj2/occitanie-2026/footprint_5/map_country.png"

                        <a class="fp-coords" href="https://www.openstreetmap.org/?mlat=44.606373&amp;mlon=2.032145#map=12/44.606373/2.032145" target="_blank" rel="noopener">

                <div class="fp-heading">
                    <h1 class="fp-title">Figeac</h1>
                    <p class="fp-subtitle">
                            <span>
                                    3 août 2026
                            </span>
 , France, Carmel du Sacré-Cœur                    </p>
<p class="fp-subtitle fp-trip">🇫🇷 Occitanie 2026</p>                        <dl class="fp-facts">
                                <div>
                                    <dt>Météo</dt>
                                    <dd>☁️ 33 °C</dd>
                                </div>
                                <div>

                                    <dd>191 m</dd>
                                </div>
                        </dl>
                </div>
            </div>

            <div class="fp-text"></div>

        </header>



    </article>

    <script>
        document.querySelectorAll('.fp-text a[href^="http://"], .fp-text a[href^="https://"]').forEach((link) => {
            link.target = '_blank';
            link.rel = 'noopener';
        });
    </script>
