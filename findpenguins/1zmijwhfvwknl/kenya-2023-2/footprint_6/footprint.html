<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nairobi</title>
    <link rel="stylesheet" href="https://lburais.github.io/website/theme/findpenguins/css/footprint.css" type="text/css" />
</head>
<body>

    <article class="footprint">
        <a class="fp-adventures-link" href="https://lburais.github.io/website/aventures.html" aria-label="Retour aux carnets de voyage" title="Carnets de voyage">
            <span aria-hidden="true" style="color: #000000; font-size: 12px;">🌐&#xFE0E;</span>
        </a>
        <header class="fp-header">
            <div class="fp-hero fp-hero-map">
                <div class="fp-nav">
<a class="fp-arrow" href="https://lburais.github.io/website/findpenguins/1zmijwhfvwknl/kenya-2023-2/footprint_5/footprint.html" title="Laikipia">&#9664;</a>                    <div class="fp-progress" aria-label="Jour 7">
                        <div class="fp-progress-fill" style="width: 100.0%"></div>
                        <span class="fp-day" style="left: 100.0%">Jour 7</span>
                    </div>
<span class="fp-arrow fp-arrow-off">&#9654;</span>                </div>

                    <div class="fp-map">
                        <div class="fp-map-frame" id="fp-country-map"
                            role="img"
                            aria-label="Carte de Nairobi">
                            <img src="https://lburais.github.io/website/findpenguins/1zmijwhfvwknl/kenya-2023-2/footprint_6/map_country.png"
                                alt="Carte de Nairobi"
                                loading="lazy" />
                        </div>
                        <a class="fp-coords" href="https://www.openstreetmap.org/?mlat=-1.331555&amp;mlon=36.924971666667#map=12/-1.331555/36.924971666667" target="_blank" rel="noopener">
                            1.3316° S, 36.9250° E
                        </a>
                    </div>
                <div class="fp-heading">
                    <h1 class="fp-title">Nairobi</h1>
                    <p class="fp-subtitle">
                            <span>
                                    3 octobre 2023
                            </span>
 , Kenya, Nairobi                    </p>
<p class="fp-subtitle fp-trip">🇰🇪 Kenya 2023</p>                        <dl class="fp-facts">
                                <div>
                                    <dt>Météo</dt>
                                    <dd>⛅ 27 °C</dd>
                                </div>
                                <div>
                                    <dt>Altitude</dt>
                                    <dd>1609 m</dd>
                                </div>
                        </dl>
                </div>
            </div>

            <div class="fp-text"></div>

        </header>



    </article>

    <script>
        document.querySelectorAll('.fp-text a[href^="http://"], .fp-text a[href^="https://"]').forEach((link) => {
            link.target = '_blank';
            link.rel = 'noopener';
        });
    </script>

</body>
</html>
