 , Switzerland, Genève                    </p>
<p class="fp-subtitle fp-trip">Chamonix 2024</p>                        <dl class="fp-facts">

        document.querySelectorAll('.fp-text a[href^="http://"], .fp-text a[href^="https://"]').forEach((link) => {
