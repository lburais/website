<!DOCTYPE html>
<html lang="fr">
<head>

    <link rel="stylesheet" href="https://lburais.github.io/website/theme/findpenguins/css/footprint.css" type="text/css" />

<body>

<span class="fp-arrow fp-arrow-off">&#9654;</span>                </div>

                    <div class="fp-map">

                <div class="fp-heading">
                    <h1 class="fp-title">Faro</h1>
                    <p class="fp-subtitle">

                                    27 octobre 2025
                            </span>
 , Portugal, Faro                    </p>
<p class="fp-subtitle fp-trip">🇵🇹 Algarve 2025</p>                        <dl class="fp-facts">
                                <div>

                                <div>

                                    <dd>12 m</dd>
                                </div>
                        </dl>
                </div>
            </div>

            <div class="fp-text"></div>

        </header>



    </article>

    <script>
        document.querySelectorAll('.fp-text a[href^="http://"], .fp-text a[href^="https://"]').forEach((link) => {
            link.target = '_blank';
            link.rel = 'noopener';
        });
