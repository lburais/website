            <script>
                const carouselTimers = {};

                function setSlide(index, carouselId, pauseAutoPlay = false) {
                    const carousel = document.getElementById(carouselId);
                    if (!carousel) return;
                    const slides = carousel.querySelectorAll('.carousel-slide');
                    if (!slides.length) return;

                    const activeIndex = ((index % slides.length) + slides.length) % slides.length;
                    slides.forEach((slide, slideIndex) => {
                        const active = slideIndex === activeIndex;
                        slide.classList.toggle('active', active);
                        const video = slide.querySelector('video');
                        if (video && !active) video.pause();
                    });

                    document.querySelectorAll('.fp-media [data-slide-index]').forEach((thumbnail) => {
                        const active = Number(thumbnail.dataset.slideIndex) === activeIndex;
                        thumbnail.classList.toggle('active', active);
                        thumbnail.setAttribute('aria-current', active ? 'true' : 'false');
                    });

                    if (pauseAutoPlay && carouselTimers[carouselId]) {
                        clearInterval(carouselTimers[carouselId]);
                        delete carouselTimers[carouselId];
                    }
                }

                function moveSlide(direction, carouselId) {
                    const carousel = document.getElementById(carouselId);
                    if (!carousel) return;
                    const slides = carousel.querySelectorAll('.carousel-slide');
                    let activeIndex = Array.from(slides).findIndex(slide => slide.classList.contains('active'));
                    setSlide(activeIndex + direction, carouselId);
                }

                function userMoveSlide(direction, carouselId) {
                    moveSlide(direction, carouselId);
                    startAutoPlay(carouselId);
                }

                function startAutoPlay(carouselId) {
                    const carousel = document.getElementById(carouselId);
                    if (!carousel) return;
                    const interval = parseInt(carousel.getAttribute('data-interval')) || 5000;

                    if (carouselTimers[carouselId]) {
                    clearInterval(carouselTimers[carouselId]);
                    }

                    carouselTimers[carouselId] = setInterval(() => {
                    moveSlide(1, carouselId);
                    }, interval);
                }

                document.addEventListener("DOMContentLoaded", () => {
                    const carouselId = 'manual-carousel';
                    const carousel = document.getElementById(carouselId);
                    if (!carousel) return;
                    setSlide(0, carouselId);
                    startAutoPlay(carouselId);

                    const mediaStrip = document.querySelector('.fp-media');
                    mediaStrip?.addEventListener('pointerenter', () => {
                        if (carouselTimers[carouselId]) {
                            clearInterval(carouselTimers[carouselId]);
                            delete carouselTimers[carouselId];
                        }
                    });

                    mediaStrip?.querySelectorAll('[data-slide-index]').forEach((thumbnail) => {
                        thumbnail.addEventListener('click', (event) => {
                            event.preventDefault();
                            setSlide(Number(thumbnail.dataset.slideIndex), carouselId, true);
                        });
                    });
                });
            </script>
